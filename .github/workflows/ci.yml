name: CI

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet Restore
        working-directory: PropertyManagement

      - name: Format check
        run: dotneet format --verify-no-changes
        working-directory: PropertyManagement

      - name: Build
        run: dotnet build --no-restore
        working-directory: PropertyManament

      - name: Test
        run: dotnet test --no-build
        working-directory: PropertyManagement